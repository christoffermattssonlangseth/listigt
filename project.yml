name: Listigt
options:
  bundleIdPrefix: se.langseth
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 7R6QL53THM
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Listigt:
    type: application
    platform: iOS
    sources: [Listigt]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.langseth.listigt
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Listigt/Info.plist
      properties:
        CFBundleDisplayName: Listigt
        CFBundleDevelopmentRegion: sv
        CKSharingSupported: true
        NSCameraUsageDescription: Kameran används för att scanna streckkoder på varor.
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Listigt/Listigt.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers: [iCloud.se.langseth.listigt]
        com.apple.developer.icloud-services: [CloudKit]
